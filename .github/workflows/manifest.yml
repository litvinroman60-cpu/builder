name: manifest
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-manifest
  cancel-in-progress: false

jobs:
  generate:
    name: Generate manifest
    # Publish on success AND on partial-failure: one flaky board (e.g. a
    # transient toolchain 502) should not deny manifest updates for the
    # platforms that did upload artifacts. enrich_manifest.py reads
    # whatever assets actually exist on the release.
    #
    # First clause: on a mirror the nightly's jobs skip, but the run still
    # completes and fires workflow_run, so gate the cron-originated path on
    # the canonical repo too -- see master.yml's preflight. Dispatch-driven
    # manifest regeneration is untouched anywhere.
    if: >-
      (github.event.workflow_run.event != 'schedule' ||
       github.repository == 'OpenIPC/builder') &&
      (github.event_name == 'workflow_dispatch' ||
       contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (for the script)
        uses: actions/checkout@v4
        with:
          path: master

      - name: Checkout gh-pages (for output)
        id: checkout_pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      # Forks and new mirrors may not have a gh-pages branch yet. Bootstrap an
      # empty orphan branch instead of failing before manifest generation.
      - name: Initialize gh-pages when absent
        if: steps.checkout_pages.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf pages
          mkdir pages
          cd pages
          git init -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          touch .nojekyll
          git add .nojekyll
          git commit -m "Initialize gh-pages"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin gh-pages

      - name: Generate manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 master/.github/scripts/enrich_manifest.py pages

      - name: Publish to gh-pages
        working-directory: pages
        run: |
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add manifest.json manifest.flat
          if git diff --cached --quiet; then
            echo "No manifest changes; nothing to commit."
          else
            newest=$(jq -r '.channels.nightly // "empty"' manifest.json)
            git commit -m "manifest: $(date -u +%FT%TZ) — ${newest}"
            git push
          fi
